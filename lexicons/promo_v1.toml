# ---------------------------------------------------------------- reply openers
# A clip whose first line starts with one of these probably joins a conversation midway.
# Matched only at the start of a line.

[openers]
weight = 1.0
kinds = ["DIALOGUE"]
terms = [
  "yes", "no", "because", "and", "but", "so", "then", "of course", "exactly", "indeed", "not",
  "nor", "well", "too", "neither", "still", "anyway", "fine",
]
