# ---------------------------------------------------------------- camera and sound emphasis

[camera.emphasis]
weight = 1.0
kinds = ["CAMERA"]
terms = [
  "extreme close-up", "extreme close up", "macro", "crash zoom", "snap zoom", "whip pan",
  "slow motion", "slow-motion", "freeze frame", "dutch", "rack focus", "insert", "push-in",
  "pushing in", "push in",
]

[sfx.hit]
