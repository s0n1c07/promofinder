[project]
name = "promofinder"
version = "0.1.0"
description = "Finds promo clips (hook to cliffhanger) in timestamped microdrama screenplays."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
promofinder = "promofinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promofinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
